services:
  postgres:
    image: postgres:18
    container_name: vidalstore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vidalstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en el .env}
      POSTGRES_DB: ${POSTGRES_DB:-vidalstore}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vidalstore} -d ${POSTGRES_DB:-vidalstore}']
      interval: 5s
      timeout: 5s
      retries: 20

  rabbit1:
    image: rabbitmq:4.3-management
    container_name: vidalstore-rabbit1
    hostname: rabbit1
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-vidalstore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?define RABBITMQ_DEFAULT_PASS en el .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?define RABBITMQ_ERLANG_COOKIE en el .env}
    ports:
      - '5672:5672'
      - '15672:15672'
    volumes:
      - rabbit1_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12

  rabbit2:
    image: rabbitmq:4.3-management
    container_name: vidalstore-rabbit2
    hostname: rabbit2
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-vidalstore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?define RABBITMQ_DEFAULT_PASS en el .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_DEFAULT_VHOST:-/}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?define RABBITMQ_ERLANG_COOKIE en el .env}
    ports:
      - '5673:5672'
      - '15673:15672'
    volumes:
      - rabbit2_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 12

volumes:
  postgres_data:
  rabbit1_data:
  rabbit2_data:
