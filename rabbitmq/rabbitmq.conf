# Formación automática del clúster (L8).
# El nombre del nodo de RabbitMQ es rabbit@<hostname>; los hostnames están fijos
# en el compose. Con este archivo, un nodo que nace vacío descubre y se une solo
# al otro, sin unión a mano y sin depends_on entre los nodos.
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2
